#==============================================================
# PYNQ-Z2 + FT2232H ("Dual RS232")  ->  Nuclei hbirdv2 E203 (RV32IMAC)
# OpenOCD config ONLY. Do NOT paste into any .c/.h.
#
# Fixed 2026-09-28:
#   * added -expected-id  (real E203 IDCODE is 0x1E200A6D, mfg 0x536 = Nuclei,
#     part 0xE200, ver 1 -- NOT 0x10001FFF)
#   * work area moved out of the program region (see below)  adapter_khz: 1 MHz verified clean on 2026-09-28
#==============================================================
adapter_khz 1000
interface ftdi
ftdi_device_desc "Dual RS232"
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x0008 0x000b

transport select jtag

# hbirdv2 E203 TAP: 5-bit IR, IDCODE 0x1E200A6D
jtag newtap e203 cpu -irlen 5 -expected-id 0x1e200a6d

target create e203.cpu riscv -chain-position e203.cpu

# Memory map of this SoC build (see coremark.map):
#   ILM (ITCM) 0x80000000 .. 0x8000FFFF   -> program (.init/.text/.rodata ends ~0x8000B190)
#   RAM (DTCM) 0x90000000 .. 0x9000FFFF   -> .data/.bss/heap/stack
# work-area ? DTCM ????0x90006000????? ILM ???
# LeNet ? .rodata ???? 0x8000FB2C?????? 0x8000C000 ??????????2026-10-07 ??
e203.cpu configure -work-area-phys 0x90006000 -work-area-size 0x2000 -work-area-backup 0

init
halt
